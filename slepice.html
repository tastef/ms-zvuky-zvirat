<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slepice - zvuk zvířete</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #a8e063, #56ab2f);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    text-align: center;
    color: white;
  }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 30px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  button {
    background: white;
    color: #2e7d32;
    border: none;
    border-radius: 50%;
    width: 140px;
    height: 140px;
    font-size: 4rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  button:active {
    transform: scale(0.94);
  }
  .hint {
    margin-top: 24px;
    font-size: 1rem;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Slepice</h1>
    <button id="playBtn" aria-label="Přehrát zvuk">&#9658;</button>
    <div class="hint" id="hint">Klepni pro přehrání zvuku</div>
  </div>

  <audio id="audio" src="zvuky/slepice.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    const hint = document.getElementById('hint');

    function playSound() {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    // Pokus o automatické přehrání hned po načtení
    window.addEventListener('load', () => {
      audio.play().then(() => {
        hint.textContent = 'Přehrává se...';
      }).catch(() => {
        // Autoplay zablokován prohlížečem - počká se na klepnutí
      });
    });

    btn.addEventListener('click', playSound);
    audio.addEventListener('play', () => hint.textContent = 'Přehrává se...');
    audio.addEventListener('ended', () => hint.textContent = 'Klepni pro přehrání znovu');
  </script>
</body>
</html>
